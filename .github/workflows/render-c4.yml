name: Render C4 PlantUML Diagrams

on:
  push:
    branches: [ main ]
    paths:
      - 'diagrams/**/*.puml'
      - '.github/workflows/render-c4.yml'
  pull_request:
    paths:
      - 'diagrams/**/*.puml'

permissions:
  contents: write

jobs:
  render-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PlantUML and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz

      - name: Render PUML to SVG and PNG
        run: |
          mkdir -p generated/svg generated/png
          find diagrams -name "*.puml" | while read file; do
            echo "Rendering $file..."
            plantuml -tsvg -o "$PWD/generated/svg" "$file"
            plantuml -tpng -o "$PWD/generated/png" "$file"
          done

      - name: Commit generated diagrams on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add generated/
          git diff --staged --quiet || git commit -m "chore(c4): renderizar diagramas SVG/PNG actualizados"
          git push